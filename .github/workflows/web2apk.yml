name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: true
      icon_url:
        description: 'URL icon PNG'
        required: true

jobs:
  build-web2apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --org com.web2apk --project-name web2apk_app web2apk_app
          cd web2apk_app
          flutter pub add webview_flutter

      - name: Replace main.dart
        run: |
          cd web2apk_app
          cat > lib/main.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '${{ inputs.app_name }}',
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;
            bool isLoading = true;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageFinished: (_) => setState(() => isLoading = false),
                ))
                ..loadRequest(Uri.parse('${{ inputs.web_url }}'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('${{ inputs.app_name }}')),
                body: Stack(
                  children: [
                    WebViewWidget(controller: controller),
                    if (isLoading)
                      const Center(child: CircularProgressIndicator()),
                  ],
                ),
              );
            }
          }
          DARTEOF

      - name: Download icon
        run: |
          cd web2apk_app
          curl -L "${{ inputs.icon_url }}" -o icon.png
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-hdpi
          convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png || \
            cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Update app name
        run: |
          cd web2apk_app
          sed -i 's/android:label=".*"/android:label="${{ inputs.app_name }}"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd web2apk_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-build
          path: web2apk_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3
